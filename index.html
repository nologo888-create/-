        function getThaiZodiac(day, month) {
            const s = [{m:4, d:13, e:"ไฟ"}, {m:5, d:15, e:"ดิน"}, {m:6, d:15, e:"ลม"}, {m:7, d:15, e:"น้ำ"}, {m:8, d:16, e:"ไฟ"}, {m:9, d:17, e:"ดิน"}, {m:10, d:17, e:"ลม"}, {m:11, d:16, e:"น้ำ"}, {m:12, d:16, e:"ไฟ"}, {m:1, d:15, e:"ดิน"}, {m:2, d:13, e:"ลม"}, {m:3, d:15, e:"น้ำ"}];
            for(let i=0; i<s.length; i++) if(month == s[i].m && day >= s[i].d) return s[i].e;
            return "ไฟ";
        }

        function seededRandom(seed) { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

        function calculateFullFortune() {
            const dateVal = document.getElementById('birthdate').value;
            if(!dateVal) return;
            const b = new Date(dateVal);
            const today = new Date();
            
            // Seed แบบคงที่ (Static - นิสัย) และ แบบเปลี่ยนรายวัน (Daily - ดวง)
            const staticSeed = (b.getDate() * 31 + b.getMonth() * 12 + b.getFullYear());
            const dailySeed = (today.getDate() * 73 + today.getMonth() * 101 + today.getFullYear());
            
            // 1. คำนวณนิสัย (Static - คงที่ตลอดไป)
            const t1 = db.traitParts.start[staticSeed % db.traitParts.start.length];
            const t2 = db.traitParts.nature[Math.floor(staticSeed / 7) % db.traitParts.nature.length];
            const t3 = db.traitParts.strength[Math.floor(staticSeed / 13) % db.traitParts.strength.length];
            const t4 = db.traitParts.advice[Math.floor(staticSeed / 19) % db.traitParts.advice.length];
            const trait = t1 + t2 + t3 + t4;
            
            const path = db.lifePath[staticSeed % 9]; 
            const element = getThaiZodiac(b.getDate(), b.getMonth() + 1);
            
            // 2. คำนวณดวงรายวัน (Daily - เปลี่ยนใหม่ทุกวัน)
            const getFortune = (cat, idx, offset) => db.fortunes[cat][idx][Math.floor(seededRandom(dailySeed + offset) * 20)];
            const finalWork = getFortune('w', 0, 1) + getFortune('w', 1, 2) + getFortune('w', 2, 3);
            const finalLove = getFortune('l', 0, 4) + getFortune('l', 1, 5) + getFortune('l', 2, 6);
            
            // 3. เลขนำโชคและเมนู
            const n1 = (dailySeed % 9) + 1; 
            const n2 = ((dailySeed * 7) % 9) + 1; 
            const n3 = ((dailySeed * 13) % 9) + 1;
            const elementMenus = db.menus[element];
            const dailyMenus = [...elementMenus].sort(() => 0.5 - seededRandom(dailySeed + 99)).slice(0, 3);

            // แสดงผล
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <span class="highlight">พื้นฐานนิสัย:</span> ${trait}
                <span class="highlight" style="margin-top:10px;">รหัสชีวิต:</span> ${path}
                <div class="divider"></div>
                <span class="highlight">การงาน/การเงิน:</span> ${finalWork}
                <span class="highlight">ความรัก:</span> ${finalLove}
                <div class="divider"></div>
                <span class="highlight">เลขนำโชควันนี้:</span>
                <div class="lucky-numbers">${n1} - ${n2} - ${n3}</div>
                <div class="menu-box">
                    <span class="highlight" style="margin-top:0;">🍳 เมนูแนะนำวันนี้ (ธาตุ${element})</span>
                    <div class="menu-item">🍱 ${dailyMenus[0]}</div>
                    <div class="menu-item">🍱 ${dailyMenus[1]}</div>
                    <div class="menu-item">🍱 ${dailyMenus[2]}</div>
                </div>
            `;
        }
    </script>
</body>
