<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คอิน ตามสั่ง โหราศาสตร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mali', cursive; background: linear-gradient(135deg, #e0c3fc 0%, #fbc2eb 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        .container { background: rgba(255, 255, 255, 0.98); padding: 30px 20px; border-radius: 30px; box-shadow: 0 12px 35px rgba(186, 104, 200, 0.4); text-align: center; max-width: 450px; width: 90%; }
        h1 { color: #b366ff; font-size: 26px; margin-bottom: 5px; }
        .subtitle { color: #c084fc; font-size: 14px; margin-bottom: 20px; }
        input[type="date"] { width: 85%; padding: 12px; border: 2px dashed #c084fc; border-radius: 15px; font-family: 'Mali', cursive; font-size: 16px; margin-bottom: 20px; text-align: center; background: #fdf8ff; }
        button { background: linear-gradient(45deg, #da70d6, #ba55d3); color: white; border: none; padding: 14px 25px; font-size: 18px; font-weight: 600; border-radius: 25px; cursor: pointer; width: 85%; transition: 0.3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(186, 104, 200, 0.4); }
        #result { margin-top: 25px; padding: 20px; background: #fff; border-radius: 20px; border: 2px solid #f3d5ff; color: #444; font-size: 15px; display: none; text-align: left; }
        .highlight { color: #8e24aa; font-weight: 600; display: block; margin-top: 10px; }
        .divider { border-top: 1px dashed #e1bee7; margin: 15px 0; }
        .lucky-numbers { background: #f3e5f5; padding: 10px; border-radius: 10px; text-align: center; font-size: 22px; color: #7b1fa2; font-weight: bold; margin: 15px 0; }
        .menu-box { background: #fff9e6; border: 1px dashed #ffd54f; border-radius: 15px; padding: 12px; margin-top: 10px; }
        .menu-item { font-weight: 600; color: #ff8f00; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 เช็คอิน ตามสั่ง โหราศาสตร์</h1>
        <div class="subtitle">โหราศาสตร์เจาะลึกและเมนูแนะนำตามธาตุ</div>
        <input type="date" id="birthdate" required>
        <button onclick="calculateFullFortune()">ผูกดวงและดูเมนูวันนี้ 🪄</button>
        <div id="result"></div>
    </div>
    <script>
        const db = {
            dayTraits: { "วันจันทร์": "อ่อนโยน มีเสน่ห์ ชอบช่วยเหลือผู้อื่น มักได้รับความเมตตา", "วันอังคาร": "กล้าหาญ ขยันอดทน รักพวกพ้อง แต่ใจร้อนตรงไปตรงมา", "วันพุธ": "ฉลาด ไหวพริบดี เจรจาเก่ง ปรับตัวเข้ากับสถานการณ์ได้ดี", "วันพฤหัสบดี": "มีคุณธรรม จิตใจดี รักความยุติธรรม ชอบให้คำปรึกษา", "วันศุกร์": "รักสวยรักงาม มีรสนิยมดี มีเสน่ห์ ใจคอกว้างขวาง", "วันเสาร์": "เข้มแข็ง อดทน มุ่งมั่น สุขุมรอบคอบ จริงจังกับชีวิต", "วันอาทิตย์": "ผู้นำสูง มั่นใจในตัวเอง ชอบทำอะไรใหญ่ๆ รักเกียรติรักศักดิ์ศรี" },
            dailyTraits: { 1: "มีความเป็นผู้นำสูง มั่นใจในตัวเอง ชอบริเริ่มทำอะไรใหม่ๆ", 2: "เป็นคนอ่อนโยน มีทักษะการประสานงานดีเยี่ยม", 3: "มีเสน่ห์ดึงดูดใจ รักความสนุกสนาน", 4: "เป็นคนจริงจังกับชีวิต มีระเบียบวินัยสูง", 5: "รักอิสระ ปรับตัวเก่ง มีไหวพริบดี", 6: "เป็นผู้ให้ที่แท้จริง มีความรับผิดชอบสูง", 7: "มีความเฉลียวฉลาด ชอบวิเคราะห์", 8: "มีพลังอำนาจในการบริหาร มีความทะเยอทะยาน", 9: "มีจิตใจกว้างขวาง ชอบช่วยเหลือสังคม", 10: "มีความเด็ดขาด กล้าตัดสินใจ", 11: "มีสัญชาตญาณแม่นยำ เป็นที่ปรึกษาที่ดี", 12: "กระตือรือร้น มองโลกในแง่ดี", 13: "อดทนสูง มุ่งมั่นทำงานจนสำเร็จ", 14: "ปรับตัวเก่ง เข้ากับคนได้ทุกระดับ", 15: "รักความยุติธรรม ใจคอกว้างขวาง", 16: "มีความลึกซึ้งในการคิด รักสันโดษ", 17: "มีความมุ่งมั่นนักธุรกิจ วิสัยทัศน์กว้างไกล", 18: "เห็นอกเห็นใจผู้อื่นสูง มักมีส่วนร่วมการกุศล", 19: "เปี่ยมไปด้วยความมั่นใจ ไม่ยอมแพ้", 20: "ประนีประนอมสูง ทำงานกับผู้อื่นได้ดี", 21: "ศิลปะการพูดดี มีเสน่ห์", 22: "มีวิสัยทัศน์ มองเห็นโอกาสที่คนอื่นมองข้าม", 23: "รักการเดินทาง ชอบเสาะหาความรู้", 24: "ให้ความสำคัญกับครอบครัว ได้รับความอุปถัมภ์", 25: "ความคิดเป็นผู้ใหญ่ มักใช้เหตุผล", 26: "เจรจาต่อรองเก่ง จัดการเรื่องยากให้ง่าย", 27: "นักแสวงหาคำตอบ ชอบความท้าทาย", 28: "มุ่งมั่นแรงกล้า วางเป้าหมายไว้สูง", 29: "ความคิดสร้างสรรค์แปลกใหม่", 30: "ร่าเริง แจ่มใส ให้พลังงานบวก", 31: "ซื่อสัตย์ มั่นคงในคำพูด เป็นที่เชื่อถือ" },
            zodiacTraits: { "เมษ": "ราศีเมษ: พลังงานสูง กล้าหาญ รักความท้าทาย", "พฤษภ": "ราศีพฤษภ: มั่นคง รักความสบาย", "เมถุน": "ราศีเมถุน: ปรับตัวง่าย ช่างเจรจา", "กรกฎ": "ราศีกรกฎ: รักครอบครัว ความจำดี", "สิงห์": "ราศีสิงห์: กล้าหาญ สง่าราศี", "กันย์": "ราศีกันย์: เจ้าระเบียบ ละเอียดรอบคอบ", "ตุลย์": "ราศีตุลย์: รักความยุติธรรม มีเสน่ห์", "พิจิก": "ราศีพิจิก: ลึกลับ มุ่งมั่นลึกซึ้ง", "ธนู": "ราศีธนู: รักการผจญภัย ซื่อตรง", "มังกร": "ราศีมังกร: ทะเยอทะยาน เป้าหมายชัดเจน", "กุมภ์": "ราศีกุมภ์: รักอิสระ ความคิดก้าวหน้า", "มีน": "ราศีมีน: จิตใจดี มีสัญชาตญาณแม่นยำ" },
            zodiacYearTraits: { "ชวด": "ฉลาดปราดเปรียว", "ฉลู": "อดทนหนักแน่น", "ขาล": "กล้าหาญผู้นำ", "เถาะ": "อ่อนโยนมีเสน่ห์", "มะโรง": "ทรงพลังบารมี", "มะเส็ง": "ฉลาดลึกซึ้ง", "มะเมีย": "กระตือรือร้น", "มะแม": "จิตใจอ่อนโยน", "วอก": "ไหวพริบดี", "ระกา": "ตรงไปตรงมา", "จอ": "ซื่อสัตย์จริงใจ", "กุน": "ใจกว้างอารมณ์ดี" },
            fortunes: { w: [["ตามเกณฑ์ดวงดาว", "วิเคราะห์พลังดวงชะตา"], ["งานจะราบรื่นดี", "มีโอกาสใหม่ๆ เข้ามา"], ["การเงินคล่องตัว", "มีลาภปากโชคดี"]], l: [["ในด้านความสัมพันธ์", "ดูจากทิศทางดวงดาว"], ["คนโสดมีข่าวดี", "ความรักกำลังหวานชื่น"], ["เข้าใจกันมากขึ้น", "เป็นช่วงเวลาที่ดี"]] },
            menus: { "ไฟ": ["ข้าวไข่เจียวหมูสับ", "สามชั้นทอดน้ำปลา", "สุกี้น้ำ/แห้ง", "เนื้อผัดพริกไทยดำ", "กุ้งอบวุ้นเส้น"], "ดิน": ["กะเพราหมูกรอบ", "พริกแกงเนื้อเปื่อย", "คะน้าหมูกรอบ", "ต้มยำกุ้งน้ำข้น", "ลาบหมูคั่ว"], "ลม": ["หมูทอดกระเทียม", "คั่วพริกเกลือ", "ผัดพริกอ่อนหมู", "หมูผัดขิง", "ยำหมูยอ"], "น้ำ": ["ข้าวผัดต้มยำ", "ผัดมาม่าขี้เมา", "ข้าวยำไก่แซ่บ", "แกงจืดเต้าหู้หมูสับ", "ผัดฉ่าทะเล"] }
        };
        function getThaiZodiac(day, month) {
            const s = [{m:4, d:13, e:"ไฟ"}, {m:5, d:15, e:"ดิน"}, {m:6, d:15, e:"ลม"}, {m:7, d:15, e:"น้ำ"}, {m:8, d:16, e:"ไฟ"}, {m:9, d:17, e:"ดิน"}, {m:10, d:17, e:"ลม"}, {m:11, d:16, e:"น้ำ"}, {m:12, d:16, e:"ไฟ"}, {m:1, d:15, e:"ดิน"}, {m:2, d:13, e:"ลม"}, {m:3, d:15, e:"น้ำ"}];
            for(let i=0; i<s.length; i++) if(month == s[i].m && day >= s[i].d) return s[i].e;
            return "ไฟ";
        }
        function getDayName(date) {
            const days = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
            return days[date.getDay()];
        }
        function getZodiacName(d, m) {
            const z = ["มังกร","กุมภ์","มีน","เมษ","พฤษภ","เมถุน","กรกฎ","สิงห์","กันย์","ตุลย์","พิจิก","ธนู"];
            const cut = [15,13,14,13,15,15,16,17,17,17,16,16];
            return (d >= cut[m-1]) ? z[m-1] : z[(m+10)%12];
        }
        function getYearName(d, m, y) {
            // ลำดับนักษัตรเริ่มที่ปีชวด (ซึ่งตรงกับเศษ 0 จากการคำนวณ พ.ศ. 2527)
            const animals = ["ชวด", "ฉลู", "ขาล", "เถาะ", "มะโรง", "มะเส็ง", "มะเมีย", "มะแม", "วอก", "ระกา", "จอ", "กุน"];
            
            // คำนวณปี พ.ศ. ตามเกณฑ์สงกรานต์
            let thaiYear = (m < 4 || (m === 4 && d < 13)) ? (y + 543 - 1) : (y + 543);
            
            // คำนวณเศษเพื่อหาตำแหน่งในอาเรย์
            let index = (thaiYear - 2527) % 12;
            // ถ้าค่าติดลบให้บวก 12 เพื่อให้กลับมาเป็นค่าบวก (รองรับปีที่น้อยกว่า 2527)
            if (index < 0) index += 12;
            
            return animals[index];
        }
        function seededRandom(seed) { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
        function calculateFullFortune() {
            const dateVal = document.getElementById('birthdate').value;
            if(!dateVal) return;
            const b = new Date(dateVal);
            const d = b.getDate(), m = b.getMonth() + 1, y = b.getFullYear();
            const today = new Date();
            
            const dName = getDayName(b);
            const zName = getZodiacName(d, m);
            const yName = getYearName(d, m, y);
            const element = getThaiZodiac(d, m);

            const dynamicSeed = (d * 17) + (m * 31) + (y * 13) + (today.getDate() * 73) + (today.getMonth() * 101);
            const getFortune = (cat, idx, offset) => db.fortunes[cat][idx][Math.floor(seededRandom(dynamicSeed + offset) * 2)];
            
            const work = getFortune('w', 0, 1) + getFortune('w', 1, 2) + getFortune('w', 2, 3);
            const love = getFortune('l', 0, 4) + getFortune('l', 1, 5) + getFortune('l', 2, 6);
            const warning = ["ระวังเรื่องการใช้จ่ายเงินเกินตัว", "ระวังคำพูดทำให้เข้าใจผิด", "อย่าหักโหมงานจนลืมพักผ่อน", "ใจร้อนจะทำให้เสียโอกาส"][dynamicSeed % 4];
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <span class="highlight">พื้นฐานดวงของคุณ:</span>
                <div>เกิด${dName} | ราศี${zName} | ปี${yName}</div>
                <div style="font-size: 13px; color: #555; margin-top: 5px;">
                    * ความหมายราศี: ${db.zodiacTraits[zName]} <br>
                    * ความหมายปีนักษัตร: ${zName}ปี${yName} (${db.zodiacYearTraits[yName]})
                </div>
                <div>นิสัยรายวัน: ${db.dailyTraits[d]}</div>
                <div>พื้นฐานวันเกิด: ${db.dayTraits[dName]}</div>
                <div class="divider"></div>
                
                <span class="highlight">การงาน/การเงินวันนี้:</span> ${work}
                <span class="highlight">ความรักวันนี้:</span> ${love}
                <span class="highlight">สรุปและข้อควรระวัง:</span> ${warning}
                
                <div class="divider"></div>
                <span class="highlight">เมนูเสริมดวงธาตุ${element}:</span>
                <div class="menu-box">
                    ${db.menus[element].map(m => `<div class="menu-item">🍱 ${m}</div>`).join('')}
                    <div style="font-size:12px; margin-top:5px; color:#888;">*เมนูนี้ช่วยเสริมพลังธาตุ${element}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
