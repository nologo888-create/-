    <style>
        body { font-family: 'Mali', cursive; background: linear-gradient(135deg, #e0c3fc 0%, #fbc2eb 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        .container { background: rgba(255, 255, 255, 0.98); padding: 30px 20px; border-radius: 30px; box-shadow: 0 12px 35px rgba(186, 104, 200, 0.4); text-align: center; max-width: 450px; width: 90%; }

        button { background: linear-gradient(45deg, #da70d6, #ba55d3); color: white; border: none; padding: 14px 25px; font-size: 18px; font-weight: 600; border-radius: 25px; cursor: pointer; width: 85%; transition: 0.3s; }

            fortunes: {
                w: [
                   
			 ["ตามเกณฑ์พระคลังมหาสมบัติ ", "เมื่อดูจากองศาดาวการงาน ", "วิเคราะห์จากพลังดวงชะตา ", "ตรวจพบกระแสพลังงานใหม่ ", "ดวงดาวช่วงนี้บ่งชี้ว่า ", "หากดูจากตำแหน่งดาวจันทร์ ", "พลังงานรอบตัวคุณส่งผลให้ ", "ด้วยอิทธิพลของดวงดาวประจำวัน ", "เมื่อเปิดรหัสชะตาชีวิต ", "การโคจรของดวงดาวเผยว่า "],

                    ["การเงินไหลเข้าดีขึ้น มีลาภปากครับ", "การลงทุนให้ผลตอบแทนที่น่าพอใจมาก", "มีเกณฑ์ได้ทรัพย์สินชิ้นใหม่ในเร็ววัน", "จะมีรายรับเข้ามาแบบไม่คาดฝัน", "ฐานะการเงินมีความมั่นคงขึ้นมาก", "ควรวางแผนเรื่องการออมให้ดีเพราะโชคกำลังมา", "จะมีช่องทางทำเงินใหม่ๆ ปรากฏขึ้น", "คุ้มค่าเหนื่อย ผลตอบแทนกำลังงอกเงย", 
"ดวงการเงินโดดเด่นมากในช่วงนี้", "หยิบจับอะไรก็เป็นเงินเป็นทองครับ"]
                ],
                
l: [
                    ["ในด้านความสัมพันธ์ ", "เมื่อถอดรหัสจากดวงชะตาช่วงนี้ ", "ดูจากทิศทางของดวงดาวคู่ครอง ", "กระแสรักของคุณในช่วงนี้ ", "หากพิจารณาถึงสัมพันธ์ภาพ ", "ช่วงนี้เสน่ห์ของคุณดึงดูดใจมาก ", "ดวงดาวแห่งความรักกำลังส่องสว่าง ", "ความสัมพันธ์มีทิศทางที่สดใส ", "ดูจากดวงชะตาเรื่องคนใกล้ชิด ", "อิทธิพลของความรักกำลังผลิดอกออกผล "],
                    ["คนโสดมีโอกาสพบคนถูกใจแบบกะทันหัน ", "คนมีคู่ช่วงนี้จะมีความเข้าใจกันมากขึ้น ", "ความสัมพันธ์กำลังเข้าสู่ช่วงหวานชื่น ", "จะมีเรื่องเซอร์ไพรส์ที่ทำให้คุณยิ้มได้ ", "มิตรภาพจะพัฒนาไปสู่ความผูกพันที่แน่นแฟ้น ", "ช่วงนี้คนรักจะคอยเป็นกำลังใจที่ดี ", "คุณจะเสน่ห์แรงเป็นพิเศษต่อเพศตรงข้าม ", "มีความเข้าใจผิดบางอย่างที่กำลังจะคลี่คลาย ", "ความสัมพันธ์ราบรื่นไม่มีอุปสรรค ", "มีข่าวดีเรื่องความรักที่รอคอย "],
                    ["คอยซัพพอร์ตกันเป็นอย่างดีครับ", "บรรยากาศรอบตัวเต็มไปด้วยความสุข", "มีความผูกพันและเชื่อใจเต็มร้อย",
 "ชีวิตรักมีความลงตัวมากขึ้นเรื่อยๆ", "มีความอบอุ่นใจเกิดขึ้นในครอบครัว", "คนรอบข้างจะอิจฉาในความรักของคุณ", "เป็นช่วงเวลาที่ควรเติมความหวานให้กัน", "จะมีเหตุการณ์ที่ทำให้เข้าใจกันมากขึ้น", "รักครั้งนี้มีอนาคตที่มั่นคง", "เป็นช่วงเวลาที่ดีที่สุดในรอบเดือนครับ"]
                ]
            },
            menus: {
                "ไฟ": ["ข้าวไข่เจียวหมูสับ", "สามชั้นทอดน้ำปลา", "สุกี้น้ำ/แห้ง", "เนื้อผัดพริกไทยดำ", "กุ้งอบวุ้นเส้น"],
                "ดิน": ["กะเพราหมูกรอบ", "พริกแกงเนื้อเปื่อย", "คะน้าหมูกรอบ", "ต้มยำกุ้งน้ำข้น", "ลาบหมูคั่ว"],
                "ลม": ["หมูทอดกระเทียม", "คั่วพริกเกลือ", "ผัดพริกอ่อนหมู", "หมูผัดขิง", "ยำหมูยอ"],
                "น้ำ": ["ข้าวผัดต้มยำ", "ผัดมาม่าขี้เมา", "ข้าวยำไก่แซ่บ", "แกงจืดเต้าหู้หมูสับ", "ผัดฉ่าทะเล"]
            }
        };

        function getThaiZodiac(day, month) {
            const s = [{m:4, d:13, e:"ไฟ"}, {m:5, d:15, e:"ดิน"}, {m:6, d:15, e:"ลม"}, {m:7, d:15, e:"น้ำ"}, {m:8, d:16, e:"ไฟ"}, {m:9, d:17, e:"ดิน"}, {m:10, d:17, e:"ลม"}, {m:11, d:16, e:"น้ำ"}, {m:12, d:16, e:"ไฟ"}, {m:1, d:15, e:"ดิน"}, {m:2, d:13, e:"ลม"}, {m:3, d:15, e:"น้ำ"}];
            for(let i=0; i<s.length; i++) if(month == s[i].m && day >= s[i].d) return s[i].e;
            return "ไฟ";
        }

        function seededRandom(seed) { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

        function calculateFullFortune() {
            const dateVal = document.getElementById('birthdate').value;
            if(!dateVal) return;
            const b = new Date(dateVal);
            const today = new Date();
            
            // แยก Seed: static คงที่ (ตัวตน), daily เปลี่ยนทุกวัน (ดวง)
            const staticSeed = (b.getDate() * 31 + b.getMonth() * 12 + b.getFullYear());
            const dailySeed = (today.getDate() * 73 + today.getMonth() * 101 + today.getFullYear());
            
            const trait = db.dayTraits[b.getDay()];
            const path = db.lifePath[staticSeed % 9]; // ใช้ staticSeed
            const element = getThaiZodiac(b.getDate(), b.getMonth() + 1);
            
            // ใช้ dailySeed สำหรับดวงรายวัน เพื่อให้เปลี่ยนทุกวัน
            const getFortune = (cat, idx, offset) => db.fortunes[cat][idx][Math.floor(seededRandom(dailySeed + offset) * db.fortunes[cat][idx].length)];
            const finalWork = "ดวงของคุณวันนี้ " + getFortune('w', 0, 1) + getFortune('w', 1, 2) + getFortune('w', 2, 3);
            const finalLove = "ดวงของคุณวันนี้ " + getFortune('l', 0, 4) + getFortune('l', 1, 5) + getFortune('l', 2, 6);
            
            const n1 = (dailySeed % 9) + 1; 
            const n2 = ((dailySeed * 7) % 9) + 1; 
            const n3 = ((dailySeed * 13) % 9) + 1;
            
            const elementMenus = db.menus[element];
            const dailyMenus = [...elementMenus].sort(() => 0.5 - seededRandom(dailySeed + 99)).slice(0, 3);

            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML = `
                <span class="highlight">พื้นฐานนิสัย:</span> ${trait}
                <span class="highlight">รหัสชีวิต:</span> ${path}
                <div class="divider"></div>
                <span class="highlight">การงาน/การเงิน:</span> ${finalWork}
                <span class="highlight">ความรัก:</span> ${finalLove}
                <div class="divider"></div>
                <span class="highlight">เลขนำโชควันนี้:</span>
                <div class="lucky-numbers">${n1} - ${n2} - ${n3}</div>
                <div class="menu-box">
                    <span class="highlight" style="margin-top:0;">🍳 เมนูแนะนำวันนี้ (ธาตุ${element})</span>
                    <div class="menu-item">🍱 ${dailyMenus[0]}</div>
                    <div class="menu-item">🍱 ${dailyMenus[1]}</div>
                    <div class="menu-item">🍱 ${dailyMenus[2]}</div>
                </div>
            `;
        }
    </script>
